server {
    listen 80;
    server_name localhost;

    location /static/ {
        alias /static/;
    }

    location /protected-media/ {
        proxy_pass http://web:8000/protected-media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
