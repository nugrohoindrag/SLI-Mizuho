<!DOCTYPE html>
<html lang="id">
<head>
    {% load static %}
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
    <meta name="description" content="Sarana Legalitas Indonesia">
    <meta name="keywords" content="admin template, stack admin template, dashboard template, flat admin template, responsive admin template, web app">
    <meta name="author" content="SLI">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="msvalidate.01" content="D019AA21327EA83B892A4AB75B0641A4" />
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}{% endblock %}</title>
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/SLI-icon1.png' %}">
    <link rel="stylesheet" href="{% static 'css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/google-fonts.css' %}">
    
    <!-- DataTables v2 -->
    
    <!-- Select2 -->
    <link rel="stylesheet" href="{% static 'css/select2.min.css' %}">
    
    <!-- BEGIN: Vendor CSS-->
    <link rel="stylesheet" href="{% static 'css/jquery-jvectormap-2.0.3.css' %}"/>
    <link rel="stylesheet" href="{% static 'css/morris.css' %}"/>
    <link rel="stylesheet" href="{% static 'css/unslider.css' %}"/>
    <link rel="stylesheet" href="{% static 'css/climacons.min.css' %}"/>
    <!-- END: Vendor CSS-->
    
    <!-- BEGIN: Theme CSS-->
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}"/>
    <link rel="stylesheet" href="{% static 'css/bootstrap-extended.css' %}"/>
    <link rel="stylesheet" href="{% static 'css/colors.css' %}"/>
    <link rel="stylesheet" href="{% static 'css/components.css' %}"/>
    <!-- END: Theme CSS-->
    
    <!-- BEGIN: Page CSS-->
    <link rel="stylesheet" href="{% static 'css/vertical-menu.css' %}"/>
    <link rel="stylesheet" href="{% static 'css/palette-gradient.css' %}"/>
    <!-- END: Page CSS-->
    
    <!-- BEGIN: Custom CSS-->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}"/>
    <link rel="stylesheet" href="{% static 'css/editable.css' %}"/>
    <!--<link rel="stylesheet" href="#">-->
    <script src="{% static 'js/jquery-3.6.0.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <!-- END: Custom CSS-->
</head>

<body class="vertical-layout vertical-menu 2-columns fixed-navbar" data-open="click" data-menu="vertical-menu" data-col="2-columns" data-force-password-change="{% if force_password_change %}true{% else %}false{% endif %}">
    {% include "my_app/navbar.html" %}
    {% include "my_app/main-menu-content.html" %}
    
    {% block content %}{% endblock %}
    
    <div class="sidenav-overlay"></div>
    <div class="drag-target"></div>
    
    {% include "my_app/footer.html" %}
    
    <!-- jQuery & Bootstrap -->
    <script src="{% static 'js/menu.js' %}"></script>
    <script src="{% static 'js/vendors.min.js' %}"></script>
    <script src="{% static 'js/sweetalert2.all.min.js' %}"></script>
    <script src="{% static 'js/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    
    <!-- DataTables v2 -->
    <script src="{% static 'js/jquery.dataTables.min.js' %}"></script>
    <script src="{% static 'js/dataTables.bootstrap5.min.js' %}"></script>
    
    <!-- Feather / Knob / Sparkline / XLSX -->
    
    <script src="{% static 'js/xlsx.full.min.js' %}"></script>
    <script src="{% static 'js/feather.min.js' %}"></script>
    
    <!-- Dashboard JS -->
    <script src="{% static 'js/app-menu.js' %}"></script>
    <script src="{% static 'js/app.js' %}"></script>
    
    <!-- Select2 -->
    <script src="{% static 'js/select2.min.js' %}"></script>
    
    <!-- BEGIN: Page Vendor JS (versi static) -->
    <script src="{% static 'js/jquery.knob.min.js' %}"></script>
    <script src="{% static 'js/knob.js' %}"></script>
    <script src="{% static 'js/raphael-min.js' %}"></script>
    <script src="{% static 'js/morris.min.js' %}"></script>
    <script src="{% static 'js/jquery-jvectormap-2.0.3.min.js' %}"></script>
    <script src="{% static 'js/jquery-jvectormap-world-mill.js' %}"></script>
    <script src="{% static 'js/visitor-data.js' %}"></script>
    <script src="{% static 'js/chart.min.js' %}"></script>
    <script src="{% static 'js/unslider-min.js' %}"></script>
    
    <link rel="stylesheet" href="{% static 'css/palette-climacon.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.min.css' %}" />
    <!-- END: Page Vendor JS-->
    
    <!-- BEGIN: Page JS -->
    <script>
        if (window.location.pathname.includes("login")) {
            localStorage.removeItem("sidebar_menu_cache");
        }
        // Init Select2 aman
        $(function () {
            if (!$.fn.select2) {
                console.error('Select2 belum termuat. Cek <script> JS Select2.');
                    return;
                }
                $('.select2').each(function () {
                    var $el = $(this);
                    if ($el.hasClass('select2-initialized')) return;
                    
                    var $modal = $el.closest('.modal');
                    var opts = {
                        placeholder: "-- Pilih Cabang --",
                        allowClear: true,
                        width: '100%'
                    };
                    if ($modal.length) opts.dropdownParent = $modal;
                    
                    $el.select2(opts).addClass('select2-initialized');
                });
            });
            
            // CHANGED: Feather dipanggil sekali via DOMContentLoaded (hindari nested di jQuery)
            document.addEventListener('DOMContentLoaded', function () {
                if (window.feather && typeof feather.replace === 'function') {
                    feather.replace();
                }
            });
            
            // CHANGED: Guard ringan agar dashboard tidak error kalau plugin dimatikan
            (function () {
                if (typeof $ !== 'undefined') {
                    if (!$.fn.knob) {
                        // console.warn('jQuery Knob tidak terpasang, melewati init knob');
                    }
                    if (!$.fn.sparkline) {
                        // console.warn('jQuery Sparkline tidak terpasang, melewati init sparkline');
                    }
                }
            })();
            
            window.csrfToken = "{{ csrf_token }}";
        </script>
        <!-- END: Page JS -->
        
        {% block script %}{% endblock %}
    </body>
    </html>
